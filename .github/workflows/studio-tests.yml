name: Studio — tests
on:
  push:
    paths: ["studio/**", ".github/workflows/studio-tests.yml"]
  pull_request:
    paths: ["studio/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: studio } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - run: pip install -q fastapi uvicorn numpy pillow pytest httpx
      - run: node --check web/app.js
      - run: python -m pytest -q tests
  blender:
    # Production réelle avec Blender (EEVEE/Workbench via écran virtuel) et voix espeak-ng.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: studio } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng blender xvfb libgl1-mesa-dri libegl1
      - run: pip install -q fastapi uvicorn numpy pillow pytest httpx
      - run: STUDIO_TEST_BLENDER=1 STUDIO_TEST_TTS=espeak-ng python -m pytest -q tests/test_api.py -k production
