name: extra-tmp
on:
  push:
    branches: [extra-tmp]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install requests -q && python extra/make.py
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      - run: |
          gh release delete extra_voix -y --cleanup-tag 2>/dev/null || true
          gh release create extra_voix out.mp4 voice.mp3 -t extra_voix -n extra
        env:
          GH_TOKEN: ${{ github.token }}
