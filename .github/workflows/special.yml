name: Produire une édition spéciale
on:
  push:
    paths: ["episodes/special_*.json"]
permissions:
  contents: write
concurrency: episode
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q pillow numpy
      - name: Rendu + publication de chaque fichier modifié
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for F in $(git diff --name-only HEAD~1 HEAD -- 'episodes/special_*.json' | sort); do
            N=$(python3 -c "import json;print(json.load(open('$F'))['out_name'])")
            rm -rf out; python3 engine/render.py "$F" out
            gh release delete "$N" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$N" out/$N.mp4 --title "$N" --notes-file out/description.txt
          done
      - name: Sauver la voix (évite de repayer ElevenLabs)
        if: always()
        run: |
          git config user.name "petitbourg-bot"; git config user.email "bot@users.noreply.github.com"
          git pull -q --rebase || true
          git add episodes/voice_cache 2>/dev/null && git commit -qm "cache voix" && git push -q || true
